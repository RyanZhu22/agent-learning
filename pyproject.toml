[project]
name = "agent-learning"
version = "0.1.0"
description = "用 Python 学习 Agent：知识库与工单助手"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1,<2",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<1",
    "httpx2>=2,<3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 只保留真实缺陷与导入顺序；BLE001 等风格规则会与教学代码里刻意的兜底冲突。
select = ["E4", "E7", "E9", "F", "I"]
